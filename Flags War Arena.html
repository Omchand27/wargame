  let sp=Math.hypot(f.vx,f.vy);if(!S.open||d>PULL){if(sp<85){f.vx*=85/(sp||1);f.vy*=85/(sp||1)}else if(sp>260){f.vx*=.985;f.vy*=.985}}
  d=Math.hypot(f.x,f.y)||1;if(d+r>R){const nx=f.x/d,ny=f.y/d;f.x=nx*(R-r);f.y=ny*(R-r);const vn=f.vx*nx+f.vy*ny;if(vn>0){f.vx-=1.9*vn*nx;f.vy-=1.9*vn*ny}}
  for(let i=0;i<6;i++){const s=seg(S.bars[i],S.ba),ex=s[2]-s[0],ey=s[3]-s[1];let t=((f.x-s[0])*ex+(f.y-s[1])*ey)/(ex*ex+ey*ey);t=Math.max(0,Math.min(1,t));const px=s[0]+ex*t,py=s[1]+ey*t,dx=f.x-px,dy=f.y-py,dd=Math.hypot(dx,dy)||1,m=r+7;
   if(dd<m){const nx=dx/dd,ny=dy/dd;f.x=px+nx*m;f.y=py+ny*m;const vn=f.vx*nx+f.vy*ny;if(vn<0){f.vx-=1.9*vn*nx;f.vy-=1.9*vn*ny}}}
 }
 for(let i=0;i<F.length;i++){const a=F[i];if(a.out||a.gone)continue;for(let j=i+1;j<F.length;j++){const b=F[j];if(b.out||b.gone)continue;const dx=b.x-a.x,dy=b.y-a.y,m=a.r+b.r;if(dx*dx+dy*dy<m*m){const d=Math.hypot(dx,dy)||.01,nx=dx/d,ny=dy/d,o=(m-d)/2;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(vn<0){const j2=-1.92*vn/2;a.vx-=j2*nx;a.vy-=j2*ny;b.vx+=j2*nx;b.vy+=j2*ny}}}}
 for(let i=S.par.length-1;i>=0;i--){const p=S.par[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;if(p.l<=0)S.par.splice(i,1)}
 if(S.par.length>260)S.par.splice(0,S.par.length-260);
 for(let i=S.shock.length-1;i>=0;i--){S.shock[i]+=dt;if(S.shock[i]>.6)S.shock.splice(i,1)}
 if(S.winAt===2){S.winAt=0;win(F.find(f=>!f.out))}
}
// ---------- render ----------
function draw(){
 X.setTransform(DPR,0,0,DPR,0,0);X.fillStyle="#05060f";X.fillRect(0,0,W,H);
 let g=X.createRadialGradient(0,H*.5,0,0,H*.5,W*.9);g.addColorStop(0,"rgba(40,90,220,.35)");g.addColorStop(1,"rgba(0,0,0,0)");X.fillStyle=g;X.fillRect(0,0,W,H);
 g=X.createRadialGradient(W,H*.5,0,W,H*.5,W*.9);g.addColorStop(0,"rgba(230,40,50,.3)");g.addColorStop(1,"rgba(0,0,0,0)");X.fillStyle=g;X.fillRect(0,0,W,H);
 X.save();X.translate(CX,CY);X.scale(K,K);
 g=X.createRadialGradient(0,0,0,0,0,R);g.addColorStop(0,"#0c1236");g.addColorStop(1,"#080b22");X.fillStyle=g;X.beginPath();X.arc(0,0,R,0,7);X.fill();
 X.shadowColor="#22d3ee";X.shadowBlur=24;X.strokeStyle="#22d3ee";X.lineWidth=5;X.beginPath();X.arc(0,0,R,0,7);X.stroke();X.shadowBlur=0;
 // portal
 const o=S.open?Math.min(1,(S.ot||0)/.25):(S.wasOpen?0:0),t=performance.now()/1000;
 const op=S.open?Math.min(1,S.ot/.25,(OPEN-S.ot)/.2+.01):0;
 X.save();X.beginPath();X.arc(0,0,RING,0,7);X.fillStyle="#2a2c6a";X.fill();X.clip();
 for(let i=0;i<8;i++){X.fillStyle=i%2?"rgba(130,110,230,.5)":"rgba(90,80,190,.55)";X.beginPath();X.moveTo(0,0);X.arc(0,0,RING,i*.785+t*.2,(i+1)*.785+t*.2);X.fill()}
 if(op>0){g=X.createRadialGradient(0,0,0,0,0,RING);g.addColorStop(0,"rgba(0,0,0,"+op+")");g.addColorStop(.55,"rgba(0,0,0,"+op*.95+")");g.addColorStop(1,"rgba(120,60,220,"+op*.5+")");X.fillStyle=g;X.fillRect(-RING,-RING,RING*2,RING*2);
  X.lineWidth=4;for(let i=0;i<4;i++){X.strokeStyle=i%2?"rgba(56,189,248,"+op+")":"rgba(192,132,252,"+op+")";X.beginPath();for(let a=0;a<9;a+=.3){const rr=a*8;X.lineTo(Math.cos(a+t*9+i*1.57)*rr,Math.sin(a+t*9+i*1.57)*rr)}X.stroke()}}
 X.restore();
 X.shadowColor=op>0?"#ff2d9a":"#f4b942";X.shadowBlur=16;X.strokeStyle=op>0?"#ff2d9a":"#f4b942";X.lineWidth=5+op*2;X.beginPath();X.arc(0,0,RING+op*6,0,7);X.stroke();X.shadowBlur=0;
 for(const s of S.shock){X.strokeStyle="rgba(200,160,255,"+(1-s/.6)+")";X.lineWidth=6;X.beginPath();X.arc(0,0,RING+s*480,0,7);X.stroke()}
 // bars
 X.lineCap="round";X.lineWidth=14;X.strokeStyle="#7b6bd6";for(let i=0;i<6;i++){const s=seg(S.bars[i],S.ba);X.beginPath();X.moveTo(s[0],s[1]);X.lineTo(s[2],s[3]);X.stroke()}
 // flags
 for(const f of S.fl){if(f.gone)continue;let x=f.x,y=f.y,sc=1,rot=0;if(f.out){const k=Math.min(1,f.sk);const d=Math.hypot(x,y)*(1-k),a=Math.atan2(y,x)+f.ang*.3;x=Math.cos(a)*d;y=Math.sin(a)*d;sc=1-k;rot=f.ang}
  const rr=f.r*sc;if(rr<.5)continue;if(f.out){X.save();X.translate(x,y);X.rotate(rot);X.drawImage(spr(f.c),-rr,-rr,rr*2,rr*2);X.restore()}else X.drawImage(spr(f.c),x-rr,y-rr,rr*2,rr*2)}
 for(const p of S.par){X.globalAlpha=Math.max(0,p.l);X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,3,0,7);X.fill()}X.globalAlpha=1;
 X.restore();
 if(S.mode==="count"){}
}
// ---------- loop ----------
function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;
 if(S.mode==="play"){step(dt/2);step(dt/2)}
 else if(S.mode==="count"){S.cnt-=dt;const n=Math.ceil(S.cnt);const b=$("big");if(n!==S.lastC&&n>=1){S.lastC=n;b.textContent=n;b.classList.remove("s");void b.offsetWidth;b.classList.add("s");sfx.beep(0)}
  if(S.cnt<=0){S.mode="play";b.textContent="GO!";b.classList.remove("s");void b.offsetWidth;b.classList.add("s");sfx.beep(1)}}
 draw();requestAnimationFrame(loop)}
// ---------- UI ----------
function pause(){if(S.mode==="play"){S.mode="pause";$("bp").textContent="▶"}else if(S.mode==="pause"){S.mode="play";$("bp").textContent="⏸"}}
$("go").onclick=start;$("pa").onclick=()=>{$("wn").classList.add("h");$("st").classList.remove("h");$("ctl").style.display="none"};
$("bp").onclick=pause;
$("bs").onclick=()=>{mute=!mute;$("bs").textContent=mute?"🔇":"🔊";if(mute)clearV()};
$("bv").onclick=()=>{voiceOn=!voiceOn;$("bv").style.opacity=voiceOn?1:.4;if(!voiceOn)clearV()};
$("br2").onclick=()=>{$("bp").textContent="⏸";start()};
document.addEventListener("visibilitychange",()=>{if(document.hidden&&S.mode==="play")pause()});
addEventListener("resize",resize);addEventListener("orientationchange",()=>setTimeout(resize,200));
document.addEventListener("touchmove",e=>{if(!e.target.matches("input"))e.preventDefault()},{passive:false});
const q=parseInt(new URLSearchParams(location.search).get("n"));$("ni").value=q>0?Math.min(q,ALL.length):ALL.length;
// the controls are only reachable once a battle is running
$("ctl").style.display="none";["bp","bs","bv","br2"].forEach(i=>$(i).style.zIndex=3);
resize();build(parseInt($("ni").value));requestAnimationFrame(loop);
