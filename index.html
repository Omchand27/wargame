<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flags War Arena</title>
<style>
:root{--cyan:#31f0f4;--yellow:#ffd84d;--bg:#060916;--panel:rgba(7,13,32,.88);--muted:#9ca9c8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#02040c;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{display:flex;justify-content:center;align-items:flex-start;padding:12px}
.app{width:min(100%,460px);aspect-ratio:9/16;min-height:0;max-height:calc(100dvh - 24px);position:relative;overflow:hidden;border:1px solid #18284a;border-radius:18px;background:radial-gradient(ellipse at 15% 22%,#10254a 0%,transparent 42%),radial-gradient(ellipse at 95% 45%,#321329 0%,transparent 43%),linear-gradient(160deg,#070d22,#050716 72%,#10091b);box-shadow:0 0 55px #102d55aa}
.app:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(#8eeaff 1px,transparent 1px);background-size:27px 27px}
header{position:absolute;z-index:3;top:3.1%;left:4%;right:4%;display:flex;align-items:center;justify-content:space-between;gap:7px}
.brand{font-weight:1000;font-size:clamp(13px,3.8vw,19px);letter-spacing:-.7px;white-space:nowrap}.brand span{color:var(--yellow)}
.stat{border:1px solid #334064;background:#080e23d9;border-radius:10px;padding:6px 9px;min-width:69px;text-align:center;box-shadow:inset 0 0 18px #17254a55}
.stat small{display:block;color:#b7c3de;font-size:8px;font-weight:800;letter-spacing:.5px}.stat strong{font-size:19px;line-height:1.1}.stat .gold{color:var(--yellow)}
.timer{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:4px solid #34364e;border-top-color:var(--yellow);font-weight:900;font-size:16px;flex-shrink:0}
.prompt{position:absolute;z-index:3;top:10.6%;left:5%;right:5%;text-align:center;font-weight:900;line-height:1.12;font-size:clamp(19px,5.5vw,28px);text-shadow:0 2px 10px #000}.prompt span{display:block;color:var(--yellow);font-size:1.06em;margin-top:3px}.subline{font-size:10px;color:#b8c6e3;letter-spacing:2px;margin-bottom:7px}
.arena-wrap{position:absolute;left:5%;right:5%;top:18.8%;height:48%;display:flex;align-items:center;justify-content:center}
canvas{width:100%;height:100%;display:block}
.notice{position:absolute;z-index:4;left:6%;right:6%;top:67.5%;min-height:44px;padding:7px 10px;border:2px solid #ff507d;border-radius:12px;background:linear-gradient(90deg,#130e22ee,#090d20f2);display:flex;align-items:center;gap:9px;box-shadow:0 0 22px #ff285833;transition:opacity .25s}
.notice .flag{font-size:27px;filter:drop-shadow(0 2px 5px #000)}.notice small{display:block;color:#ff7b9a;font-size:9px;font-weight:900;letter-spacing:.8px}.notice strong{font-size:clamp(13px,3.7vw,18px);font-weight:1000}.notice.hidden{opacity:0}
.elim-label{position:absolute;z-index:3;top:72.2%;left:5%;right:5%;text-align:center;font-size:clamp(12px,3.7vw,17px);font-weight:1000;letter-spacing:.5px}
.mini-flags{position:absolute;top:77%;left:5%;right:5%;height:5.1%;display:flex;align-content:flex-start;justify-content:center;flex-wrap:wrap;gap:3px 5px;overflow:hidden}
.mini{font-size:clamp(10px,2.9vw,14px);line-height:1;filter:drop-shadow(0 1px 2px #000);opacity:.9}
.progress{position:absolute;top:84.5%;left:4%;right:4%;height:7px;border-radius:20px;background:#30334a;overflow:hidden;box-shadow:0 0 10px #000}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#2ee7ef,#ffd84d);border-radius:20px;transition:width .2s}
.progress-label{position:absolute;top:85.6%;left:0;right:0;text-align:center;color:#c4cde1;font-size:10px;font-weight:800;letter-spacing:.5px}
.footer{position:absolute;top:89%;left:4%;right:4%;display:flex;gap:8px;align-items:center}
button{font:inherit;color:white;border:1px solid #3a476b;background:#101a35;border-radius:10px;padding:9px 11px;font-weight:850;cursor:pointer;box-shadow:0 4px 14px #0005}
button:active{transform:scale(.98)}button.primary{background:linear-gradient(100deg,#15bfcf,#3973ff);border:0;color:#fff;flex:1}
button.secondary{background:#101326}
.hint{position:absolute;bottom:1.3%;left:4%;right:4%;text-align:center;font-size:9px;color:#8290b2}
.leaderboard{position:absolute;z-index:5;right:4%;top:16%;width:43%;max-height:47%;overflow:auto;border:1px solid #314064;background:#050b1bea;border-radius:10px;padding:8px;display:none;backdrop-filter:blur(8px)}
.leaderboard.open{display:block}.leaderboard h3{font-size:11px;margin:0 0 6px;color:var(--yellow)}.leader-row{display:flex;justify-content:space-between;gap:5px;font-size:10px;padding:3px 0;border-bottom:1px solid #ffffff0d}.leader-row span:last-child{color:#9ffaff}
@media(max-height:650px){body{padding:4px}.app{max-height:calc(100dvh - 8px);border-radius:12px}.prompt{top:10%}.arena-wrap{top:18%;height:47%}}
</style>
</head>
<body>
<main class="app" aria-label="Flags War Arena game">
  <header>
    <div class="brand">FLAGS WAR <span>ARENA</span></div>
    <div class="stat"><small>COUNTRIES</small><strong id="total">195</strong></div>
    <div class="stat"><small>REMAINING</small><strong class="gold" id="remaining">195</strong></div>
    <div class="timer" id="timer">5</div>
  </header>
  <div class="prompt"><div class="subline" id="cycle">CYCLE 1 · READY</div>WHERE ARE<span>YOU FROM?</span></div>
  <div class="arena-wrap"><canvas id="arena" width="720" height="900" aria-label="Animated country flag arena"></canvas></div>
  <div class="notice hidden" id="notice"><div class="flag" id="noticeFlag">🇷🇴</div><div><small>ELIMINATED</small><strong id="noticeName">ROMANIA</strong></div></div>
  <div class="elim-label" id="elimLabel">OBSTACLES ACTIVE</div>
  <div class="mini-flags" id="miniFlags"></div>
  <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">0 / 195 ELIMINATED</div>
  <div class="footer">
    <button class="primary" id="startBtn">▶ START BATTLE</button>
    <button class="secondary" id="resetBtn">↻ RESET</button>
    <button class="secondary" id="leaderBtn" aria-label="Show leaderboard">☷</button>
  </div>
  <div class="hint">FLAGS WAR ARENA · 195 COUNTRY SIMULATION · DEMO GAME</div>
  <div class="leaderboard" id="leaderboard"><h3>COUNTRY RANKINGS</h3><div id="leaderRows"></div></div>
</main>
<script>
(() => {
  // Flag emojis use ISO region codes. A few territories are included to reach a broad,
  // recognizable set; the simulation starts with 195 country entries.
  const countryData = [
    ["🇦🇫","Afghanistan"],["🇦🇱","Albania"],["🇩🇿","Algeria"],["🇦🇩","Andorra"],["🇦🇴","Angola"],["🇦🇬","Antigua and Barbuda"],["🇦🇷","Argentina"],["🇦🇲","Armenia"],["🇦🇺","Australia"],["🇦🇹","Austria"],
    ["🇦🇿","Azerbaijan"],["🇧🇸","Bahamas"],["🇧🇭","Bahrain"],["🇧🇩","Bangladesh"],["🇧🇧","Barbados"],["🇧🇾","Belarus"],["🇧🇪","Belgium"],["🇧🇿","Belize"],["🇧🇯","Benin"],["🇧🇹","Bhutan"],
    ["🇧🇴","Bolivia"],["🇧🇦","Bosnia and Herzegovina"],["🇧🇼","Botswana"],["🇧🇷","Brazil"],["🇧🇳","Brunei"],["🇧🇬","Bulgaria"],["🇧🇫","Burkina Faso"],["🇧🇮","Burundi"],["🇨🇻","Cabo Verde"],["🇰🇭","Cambodia"],
    ["🇨🇲","Cameroon"],["🇨🇦","Canada"],["🇨🇫","Central African Republic"],["🇹🇩","Chad"],["🇨🇱","Chile"],["🇨🇳","China"],["🇨🇴","Colombia"],["🇰🇲","Comoros"],["🇨🇬","Congo"],["🇨🇷","Costa Rica"],
    ["🇨🇮","Côte d’Ivoire"],["🇭🇷","Croatia"],["🇨🇺","Cuba"],["🇨🇾","Cyprus"],["🇨🇿","Czechia"],["🇨🇩","DR Congo"],["🇩🇰","Denmark"],["🇩🇯","Djibouti"],["🇩🇲","Dominica"],["🇩🇴","Dominican Republic"],
    ["🇪🇨","Ecuador"],["🇪🇬","Egypt"],["🇸🇻","El Salvador"],["🇬🇶","Equatorial Guinea"],["🇪🇷","Eritrea"],["🇪🇪","Estonia"],["🇸🇿","Eswatini"],["🇪🇹","Ethiopia"],["🇫🇯","Fiji"],["🇫🇮","Finland"],
    ["🇫🇷","France"],["🇬🇦","Gabon"],["🇬🇲","Gambia"],["🇬🇪","Georgia"],["🇩🇪","Germany"],["🇬🇭","Ghana"],["🇬🇷","Greece"],["🇬🇩","Grenada"],["🇬🇹","Guatemala"],["🇬🇳","Guinea"],
    ["🇬🇼","Guinea-Bissau"],["🇬🇾","Guyana"],["🇭🇹","Haiti"],["🇭🇳","Honduras"],["🇭🇺","Hungary"],["🇮🇸","Iceland"],["🇮🇳","India"],["🇮🇩","Indonesia"],["🇮🇷","Iran"],["🇮🇶","Iraq"],
    ["🇮🇪","Ireland"],["🇮🇱","Israel"],["🇮🇹","Italy"],["🇯🇲","Jamaica"],["🇯🇵","Japan"],["🇯🇴","Jordan"],["🇰🇿","Kazakhstan"],["🇰🇪","Kenya"],["🇰🇮","Kiribati"],["🇰🇼","Kuwait"],
    ["🇰🇬","Kyrgyzstan"],["🇱🇦","Laos"],["🇱🇻","Latvia"],["🇱🇧","Lebanon"],["🇱🇸","Lesotho"],["🇱🇷","Liberia"],["🇱🇾","Libya"],["🇱🇮","Liechtenstein"],["🇱🇹","Lithuania"],["🇱🇺","Luxembourg"],
    ["🇲🇬","Madagascar"],["🇲🇼","Malawi"],["🇲🇾","Malaysia"],["🇲🇻","Maldives"],["🇲🇱","Mali"],["🇲🇹","Malta"],["🇲🇭","Marshall Islands"],["🇲🇷","Mauritania"],["🇲🇺","Mauritius"],["🇲🇽","Mexico"],
    ["🇫🇲","Micronesia"],["🇲🇩","Moldova"],["🇲🇨","Monaco"],["🇲🇳","Mongolia"],["🇲🇪","Montenegro"],["🇲🇦","Morocco"],["🇲🇿","Mozambique"],["🇲🇲","Myanmar"],["🇳🇦","Namibia"],["🇳🇷","Nauru"],
    ["🇳🇵","Nepal"],["🇳🇱","Netherlands"],["🇳🇿","New Zealand"],["🇳🇮","Nicaragua"],["🇳🇪","Niger"],["🇳🇬","Nigeria"],["🇰🇵","North Korea"],["🇲🇰","North Macedonia"],["🇳🇴","Norway"],["🇴🇲","Oman"],
    ["🇵🇰","Pakistan"],["🇵🇼","Palau"],["🇵🇸","Palestine"],["🇵🇦","Panama"],["🇵🇬","Papua New Guinea"],["🇵🇾","Paraguay"],["🇵🇪","Peru"],["🇵🇭","Philippines"],["🇵🇱","Poland"],["🇵🇹","Portugal"],
    ["🇶🇦","Qatar"],["🇷🇴","Romania"],["🇷🇺","Russia"],["🇷🇼","Rwanda"],["🇰🇳","Saint Kitts and Nevis"],["🇱🇨","Saint Lucia"],["🇻🇨","Saint Vincent and the Grenadines"],["🇼🇸","Samoa"],["🇸🇲","San Marino"],["🇸🇹","São Tomé and Príncipe"],
    ["🇸🇦","Saudi Arabia"],["🇸🇳","Senegal"],["🇷🇸","Serbia"],["🇸🇨","Seychelles"],["🇸🇱","Sierra Leone"],["🇸🇬","Singapore"],["🇸🇰","Slovakia"],["🇸🇮","Slovenia"],["🇸🇧","Solomon Islands"],["🇸🇴","Somalia"],
    ["🇿🇦","South Africa"],["🇰🇷","South Korea"],["🇸🇸","South Sudan"],["🇪🇸","Spain"],["🇱🇰","Sri Lanka"],["🇸🇩","Sudan"],["🇸🇷","Suriname"],["🇸🇪","Sweden"],["🇨🇭","Switzerland"],["🇸🇾","Syria"],
    ["🇹🇼","Taiwan"],["🇹🇯","Tajikistan"],["🇹🇿","Tanzania"],["🇹🇭","Thailand"],["🇹🇱","Timor-Leste"],["🇹🇬","Togo"],["🇹🇴","Tonga"],["🇹🇹","Trinidad and Tobago"],["🇹🇳","Tunisia"],["🇹🇷","Turkey"],
    ["🇹🇲","Turkmenistan"],["🇹🇻","Tuvalu"],["🇺🇬","Uganda"],["🇺🇦","Ukraine"],["🇦🇪","United Arab Emirates"],["🇬🇧","United Kingdom"],["🇺🇸","United States"],["🇺🇾","Uruguay"],["🇺🇿","Uzbekistan"],["🇻🇺","Vanuatu"],
    ["🇻🇦","Vatican City"],["🇻🇪","Venezuela"],["🇻🇳","Vietnam"],["🇾🇪","Yemen"],["🇿🇲","Zambia"],["🇿🇼","Zimbabwe"]
  ];
  const $ = id => document.getElementById(id);
  const canvas = $("arena"), ctx = canvas.getContext("2d");
  const W=720,H=900,cx=W/2,cy=H/2+5,R=316;
  const colors=["#31f0f4","#b07bff","#ffcb4d","#ff5c8a"];
  let flags=[], obstacles=[], running=false, ended=false, elapsed=0, last=0, spawnTimer=0, eliminated=[], cycle=1, noticeTimer=0, animId=0;
  const rand=(a,b)=>a+Math.random()*(b-a);
  function circlePath(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2)}
  function reset(){
    cancelAnimationFrame(animId); flags=[]; obstacles=[]; eliminated=[]; elapsed=0;last=0;spawnTimer=0;noticeTimer=0;running=false;ended=false;cycle=1;
    const count=Math.min(195,countryData.length);
    for(let i=0;i<count;i++){
      const angle=Math.random()*Math.PI*2, rr=Math.sqrt(Math.random())*(R-48);
      flags.push({id:i,emoji:countryData[i][0],name:countryData[i][1],x:cx+Math.cos(angle)*rr,y:cy+Math.sin(angle)*rr,vx:rand(-95,95),vy:rand(-95,95),r:14,alive:true,spin:rand(0,6.28),rank:0});
    }
    // Six rotating / fixed purple bars inside the neon ring.
    obstacles=[{a:-2.08,len:158,dist:206,rot:0.03},{a:-1.05,len:160,dist:210,rot:-.025},{a:0.02,len:155,dist:220,rot:.018},{a:1.05,len:160,dist:218,rot:-.02},{a:2.1,len:158,dist:220,rot:.025},{a:3.12,len:156,dist:220,rot:-.018}];
    $("total").textContent=count; $("remaining").textContent=count; $("timer").textContent="5"; $("cycle").textContent="CYCLE 1 · READY";
    $("notice").classList.add("hidden"); $("elimLabel").textContent="OBSTACLES ACTIVE"; $("startBtn").textContent="▶ START BATTLE";
    $("leaderboard").classList.remove("open"); renderMini(); updateProgress(); draw(); updateLeaderboard();
  }
  function renderMini(){
    const box=$("miniFlags");box.innerHTML="";
    eliminated.slice(-35).reverse().forEach(f=>{const s=document.createElement("span");s.className="mini";s.textContent=f.emoji;s.title=f.name+" eliminated";box.appendChild(s)});
    if(!eliminated.length){for(let i=0;i<30;i++){const s=document.createElement("span");s.className="mini";s.textContent=flags[i]?.emoji||"🏳️";box.appendChild(s)}}
  }
  function updateProgress(){
    const n=eliminated.length,total=flags.length;
    $("remaining").textContent=flags.filter(f=>f.alive).length;
    $("progressFill").style.width=(n/total*100)+"%";
    $("progressLabel").textContent=`${n} / ${total} ELIMINATED`;
  }
  function eliminate(f){
    if(!f.alive)return;f.alive=false;f.rank=eliminated.length+1;eliminated.push(f);noticeTimer=2.4;
    $("noticeFlag").textContent=f.emoji;$("noticeName").textContent=f.name.toUpperCase();$("notice").classList.remove("hidden");
    $("elimLabel").textContent=eliminated.length===flags.length-1?"FINAL COUNTRY REMAINING":"ALL ELIMINATED";
    renderMini();updateProgress();updateLeaderboard();
  }
  function updateLeaderboard(){
    const rows=[...flags].sort((a,b)=>Number(b.alive)-Number(a.alive)||a.rank-b.rank).slice(0,20);
    $("leaderRows").innerHTML=rows.map((f,i)=>`<div class="leader-row"><span>${f.alive?"#"+(i+1):"✕"} ${f.emoji} ${f.name}</span><span>${f.alive?"LIVE":f.rank+" OUT"}</span></div>`).join("");
  }
  function pointSegmentDistance(px,py,x1,y1,x2,y2){
    const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy;let t=l?((px-x1)*dx+(py-y1)*dy)/l:0;t=Math.max(0,Math.min(1,t));const x=x1+t*dx,y=y1+t*dy;return {d:Math.hypot(px-x,py-y),x,y};
  }
  function physics(dt){
    elapsed+=dt; spawnTimer+=dt;
    obstacles.forEach(o=>o.a+=o.rot*dt);
    const alive=flags.filter(f=>f.alive);
    for(const f of alive){
      f.x+=f.vx*dt;f.y+=f.vy*dt;f.spin+=dt*2;
      // Soft drift + speed cap
      f.vx+=rand(-8,8)*dt;f.vy+=rand(-8,8)*dt;
      const speed=Math.hypot(f.vx,f.vy);if(speed>125){f.vx*=125/speed;f.vy*=125/speed}
      const dx=f.x-cx,dy=f.y-cy,d=Math.hypot(dx,dy);
      if(d>R-f.r-5){const nx=dx/(d||1),ny=dy/(d||1);f.x=cx+nx*(R-f.r-5);f.y=cy+ny*(R-f.r-5);const dot=f.vx*nx+f.vy*ny;f.vx-=2*dot*nx;f.vy-=2*dot*ny;
        // Occasionally a wall bounce removes a flag to make the battle progress.
        if(Math.random()<.006+elapsed*.00005) eliminate(f);
      }
      for(const o of obstacles){
        const x1=cx+Math.cos(o.a)*o.dist-o.len/2*Math.cos(o.a+.18), y1=cy+Math.sin(o.a)*o.dist-o.len/2*Math.sin(o.a+.18);
        const x2=x1+o.len*Math.cos(o.a+.18),y2=y1+o.len*Math.sin(o.a+.18);
        const p=pointSegmentDistance(f.x,f.y,x1,y1,x2,y2);
        if(p.d<f.r+7){
          const nx=(f.x-p.x)/(p.d||1),ny=(f.y-p.y)/(p.d||1);f.x=p.x+nx*(f.r+7);f.y=p.y+ny*(f.r+7);
          const dot=f.vx*nx+f.vy*ny;f.vx-=2*dot*nx;f.vy-=2*dot*ny;f.vx+=rand(-20,20);f.vy+=rand(-20,20);
          if(Math.random()<.004+elapsed*.00004)eliminate(f);
        }
      }
    }
    // Simple flag-to-flag collision separation; elimination is obstacle-driven.
    for(let i=0;i<alive.length;i++)for(let j=i+1;j<alive.length;j++){
      const a=alive[i],b=alive[j];if(!a.alive||!b.alive)continue;
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.r+b.r-2;
      if(d>0&&d<min){const nx=dx/d,ny=dy/d,over=(min-d)/2;a.x-=nx*over;a.y-=ny*over;b.x+=nx*over;b.y+=ny*over;
        const rel=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;if(rel>0){a.vx-=rel*nx*.8;a.vy-=rel*ny*.8;b.vx+=rel*nx*.8;b.vy+=rel*ny*.8}
      }
    }
    if(alive.length>1 && elapsed>2 && spawnTimer>1.7){
      // A slow pressure mechanic guarantees a complete round, while obstacles remain the visual cause.
      spawnTimer=0;
      if(Math.random()<Math.min(.9,.18+elapsed*.012)){
        const victim=alive[Math.floor(Math.random()*alive.length)];eliminate(victim);
      }
    }
    if(alive.length<=1){running=false;ended=true;$("startBtn").textContent="▶ PLAY AGAIN";$("cycle").textContent="CYCLE "+cycle+" · COMPLETE";$("elimLabel").textContent="🏆 "+(flags.find(f=>f.alive)?.name.toUpperCase()||"NO WINNER")+" WINS";$("notice").classList.add("hidden")}
    updateProgress();
    if(noticeTimer>0){noticeTimer-=dt;if(noticeTimer<=0)$("notice").classList.add("hidden")}
    $("timer").textContent=String(Math.max(0,5-Math.floor(elapsed%5)));
    $("cycle").textContent=`CYCLE ${cycle} · LIVE`;
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    // Arena glow
    ctx.save();ctx.shadowBlur=28;ctx.shadowColor="#22e9f5";ctx.strokeStyle="#35f3f4";ctx.lineWidth=7;circlePath(cx,cy,R);ctx.stroke();ctx.restore();
    ctx.save();ctx.strokeStyle="#ffffff12";ctx.lineWidth=1;circlePath(cx,cy,R-12);ctx.stroke();ctx.restore();
    // Faint center rings
    ctx.strokeStyle="#ffd84d";ctx.lineWidth=4;ctx.shadowBlur=14;ctx.shadowColor="#ffd84d";circlePath(cx,cy,103);ctx.stroke();ctx.shadowBlur=0;
    // Obstacles
    obstacles.forEach(o=>{
      const mx=cx+Math.cos(o.a)*o.dist,my=cy+Math.sin(o.a)*o.dist;
      ctx.save();ctx.translate(mx,my);ctx.rotate(o.a+.18);ctx.lineCap="round";ctx.strokeStyle="#a77bff";ctx.lineWidth=17;ctx.shadowBlur=15;ctx.shadowColor="#8d5cff";ctx.beginPath();ctx.moveTo(-o.len/2,0);ctx.lineTo(o.len/2,0);ctx.stroke();ctx.strokeStyle="#d4b8ff";ctx.lineWidth=2;ctx.shadowBlur=0;ctx.beginPath();ctx.moveTo(-o.len/2+8,-2);ctx.lineTo(o.len/2-8,-2);ctx.stroke();ctx.restore();
    });
    flags.forEach(f=>{
      if(!f.alive)return;
      ctx.save();ctx.translate(f.x,f.y);ctx.rotate(Math.sin(f.spin)*.06);
      ctx.shadowBlur=9;ctx.shadowColor="#000";ctx.fillStyle="#f4f6ff";circlePath(0,0,f.r+2);ctx.fill();
      ctx.beginPath();ctx.arc(0,0,f.r,0,Math.PI*2);ctx.clip();
      ctx.font=`${f.r*1.85}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(f.emoji,0,1);
      ctx.restore();
    });
  }
  function loop(t){
    const dt=Math.min(.035,(t-(last||t))/1000);last=t;
    if(running)physics(dt);
    draw();animId=requestAnimationFrame(loop);
  }
  $("startBtn").addEventListener("click",()=>{
    if(ended||!flags.length){reset()}
    if(!running){running=true;ended=false;last=0;$("startBtn").textContent="Ⅱ PAUSE";$("cycle").textContent="CYCLE "+cycle+" · LIVE"}
    else{running=false;$("startBtn").textContent="▶ RESUME"}
  });
  $("resetBtn").addEventListener("click",reset);
  $("leaderBtn").addEventListener("click",()=>$("leaderboard").classList.toggle("open"));
  // Make a second click on the active button resume; label follows current state.
  const originalLoop=loop;
  reset();animId=requestAnimationFrame(loop);
})();
</script>
</body>
</html>
