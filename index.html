function spr(f){if(f.s)return f.s;const c=document.createElement("canvas");c.width=c.height=64;const x=c.getContext("2d");x.save();x.beginPath();x.arc(32,32,30,0,7);x.clip();x.fillStyle="#223";x.fill();x.font='94px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';x.textAlign="center";x.textBaseline="middle";x.fillText(f.e,32,38);const gg=x.createRadialGradient(23,19,2,32,32,32);gg.addColorStop(0,"rgba(255,255,255,0)");gg.addColorStop(.5,"rgba(255,255,255,0)");gg.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=gg;x.fillRect(0,0,64,64);x.restore();x.strokeStyle="rgba(0,0,0,.12)";x.lineWidth=2;x.beginPath();x.arc(32,32,30,0,7);x.stroke();return f.s=c}
// ---------- setup ----------
function resize(){const w=app.clientWidth,h=app.clientHeight;DPR=Math.min(window.devicePixelRatio||1,2);cv.width=w*DPR;cv.height=h*DPR;W=w;H=h;app.style.setProperty("--u",w/100+"px");K=w*.47/R;CX=w/2;CY=h*.452;mkBG();layoutGrid()}
let BG=null;
function mkBG(){BG=document.createElement("canvas");BG.width=cv.width;BG.height=cv.height;const b=BG.getContext("2d");b.setTransform(DPR,0,0,DPR,0,0);b.fillStyle="#05060f";b.fillRect(0,0,W,H);
 let g=b.createRadialGradient(0,H*.5,0,0,H*.5,W*.9);g.addColorStop(0,"rgba(40,90,220,.35)");g.addColorStop(1,"rgba(0,0,0,0)");b.fillStyle=g;b.fillRect(0,0,W,H);
 g=b.createRadialGradient(W,H*.5,0,W,H*.5,W*.9);g.addColorStop(0,"rgba(230,40,50,.3)");g.addColorStop(1,"rgba(0,0,0,0)");b.fillStyle=g;b.fillRect(0,0,W,H);
 b.translate(CX,CY);b.scale(K,K);g=b.createRadialGradient(0,0,0,0,0,R);g.addColorStop(0,"#0c1236");g.addColorStop(1,"#080b22");b.fillStyle=g;b.beginPath();b.arc(0,0,R,0,7);b.fill();
 b.shadowColor="#22d3ee";b.shadowBlur=24*K;b.strokeStyle="#22d3ee";b.lineWidth=5;b.beginPath();b.arc(0,0,R,0,7);b.stroke()}
function layoutGrid(){const g=$("gr"),n=S.N,s=Math.max(5,Math.min(W*.07,Math.floor(Math.sqrt(W*.94*H*.06/n)-1)));g.style.setProperty("--s",s+"px");[...g.children].forEach(c=>{c.style.width=c.style.height=s+"px";c.style.fontSize=s*1.05+"px"})}
function build(pool){const n=pool.length;
 clearV();S={mode:"idle",N:n,fl:[],alive:n,mt:0,open:false,wasOpen:false,pt:0,ms:{},shock:[],par:[],winAt:0,cnt:0,list:[]};
 const r=Math.max(11,Math.min(30,160/Math.sqrt(n)));S.r=r;
 const bars=[];for(let i=0;i<6;i++)bars.push(i*Math.PI/3);S.bars=bars;S.ba=0;
 pool.forEach(c=>{let x,y,t=0,ok;do{const a=css()*7,d=Math.sqrt(css())*(R-r-6);x=Math.cos(a)*d;y=Math.sin(a)*d;ok=Math.hypot(x,y)>RING+r&&S.fl.every(f=>Math.hypot(f.x-x,f.y-y)>2*r+2);t++}while(!ok&&t<400);
  const a=css()*7,sp=110+css()*90;S.fl.push({c,x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r,out:false,sk:0,ang:0,gone:false})});
 $("nC").textContent=n;$("nR").textContent=n;$("pf").style.transform="scaleX(0)";$("pt").textContent="0 / "+n+" ELIMINATED";$("gr").innerHTML="";S.fl.forEach(f=>{const i=document.createElement("i");i.textContent=f.c.e;i.style.order=999;i.style.opacity=0;f.gi=i;$("gr").appendChild(i)});$("card").classList.remove("s");$("pill").classList.remove("s");
 $("ring").classList.remove("o");$("rg").textContent=CYC;pr=null;layoutGrid()}
let MODE="r",SEL=new Set(),AI=0;
function pick(){if(MODE==="s"){const a=ALL.filter(c=>SEL.has(c.id));return a.length?a:null}
 const n=Math.max(1,Math.min(ALL.length,parseInt($("ni").value)||64)),a=ALL.slice();for(let i=a.length-1;i>0;i--){const j=css()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)}
function start(){clearInterval(AI);const pool=pick();if(!pool){$("sc").textContent="Select at least 1 country";return}ac();build(pool);unlockV();$("st").classList.add("h");$("wn").classList.add("h");
 if(S.N===1){win(S.fl[0]);return}
 S.mode="count";S.cnt=3.999;S.lastC=4;$("bp").textContent="⏸"}
function win(f){if(S.mode==="win")return;S.mode="win";sfx.win();$("wf").textContent=f.c.e;$("wt").textContent=f.c.n.toUpperCase()+" SURVIVES";const m=Math.floor(S.mt/60),s=Math.floor(S.mt%60);$("ws").textContent="LASTED "+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+" • "+S.N+" COUNTRIES";say(f.c.n+" wins!");setTimeout(()=>{$("wn").classList.remove("h");let c=10;$("nx").textContent="NEXT MATCH IN "+c;clearInterval(AI);AI=setInterval(()=>{c--;if(c<=0)start();else $("nx").textContent="NEXT MATCH IN "+c},1000)},900)}
// ---------- elimination ----------
function elim(f){f.out=true;f.sk=.0001;S.alive--;const e=S.N-S.alive;
 $("nR").textContent=S.alive;$("pt").textContent=e+" / "+S.N+" ELIMINATED";$("pf").style.transform="scaleX("+(e/(S.N-1))+")";
 f.gi.style.order=e;f.gi.style.opacity=1;
 $("cf").textContent=f.c.e;$("cn").textContent=f.c.n.toUpperCase();const cd=$("card");cd.classList.add("s");clearTimeout(S.ct);S.ct=setTimeout(()=>cd.classList.remove("s"),1700);
 sfx.out();say(f.c.n+" is out!");
 for(let k=0;k<8;k++){const a=css()*7;S.par.push({x:f.x,y:f.y,vx:Math.cos(a)*90,vy:Math.sin(a)*90,l:.6,c:css()<.5?"#a78bfa":"#38bdf8"})}
 let m=0;MS.forEach(t=>{if(t<S.N&&S.alive<=t&&!S.ms[t]){S.ms[t]=1;m=t}});
 if(m&&S.alive>1){setTimeout(()=>{sfx.ms(m);const b=$("big");b.textContent="TOP "+m;b.classList.remove("s");void b.offsetWidth;b.classList.add("s")},250)}
 if(S.alive===1){S.winAt=1}}
// ---------- physics ----------
function seg(b,t){const th=b+t,cx=Math.cos(th)*222,cy=Math.sin(th)*222,d=th,dx=Math.cos(d)*69,dy=Math.sin(d)*69;return[cx-dx,cy-dy,cx+dx,cy+dy]}
function step(dt){
 S.mt+=dt;S.ba+=dt*.28;const T=S.mt,ph=T%CYC;const c0=Math.floor(T/CYC);S.open=T>=CYC&&ph<OPEN&&S.alive>1;const pt=f=>S.open&&S.capCyc!==c0&&f===S.tg;
 if(S.open&&!S.wasOpen){sfx.open();S.shock.push(0);S.ot=0;for(let i=0;i<28;i++){const a=i/28*6.28;S.par.push({x:Math.cos(a)*RING,y:Math.sin(a)*RING,vx:-Math.cos(a)*70+Math.sin(a)*120,vy:-Math.sin(a)*70-Math.cos(a)*120,l:.9,c:"#c084fc"})}}
 if(!S.open&&S.wasOpen)sfx.close();
 if(S.open)S.ot=(S.ot||0)+dt;S.wasOpen=S.open;
 const cd=Math.ceil(T<CYC?CYC-T:CYC-ph);const ci=S.open?-1:cd;if(ci!==S.lastR){S.lastR=ci;$("rg").textContent=S.open?"!":ci;$("ring").classList.toggle("o",S.open);$("pill").textContent=S.open?"PORTAL OPEN!":"";$("pill").classList.toggle("s",S.open);if(!S.open&&ci<=3&&ci>=1)sfx.tick()}
 const pp=Math.round((S.open?1-S.ot/OPEN:(T<CYC?CYC-T:CYC-ph)/CYC)*50)*2;if(pp!==S.lp){S.lp=pp;$("ring").style.setProperty("--p",pp+"%")}const cyn=c0+1;if(cyn!==S.cn){S.cn=cyn;$("cy").textContent="CYCLE "+cyn+" • LIVE"}
 const F=S.fl,r=S.r;if(S.open&&S.capCyc!==c0){let b=1e9;S.tg=null;for(const f of F){if(f.out||f.gone)continue;const dd=Math.hypot(f.x,f.y);if(dd<b){b=dd;S.tg=f}}}
 for(const f of F){if(f.gone)continue;
  if(f.out){f.sk+=dt/.55;f.ang+=dt*14;if(f.sk>=1){f.gone=true;if(S.winAt===1&&F.every(g=>g.gone||!g.out))S.winAt=2}continue}
  let d=Math.hypot(f.x,f.y)||1;
  if(S.open&&S.capCyc!==c0&&S.alive>1&&f===S.tg){const q=Math.max(0,1-d/PULL),a=450+1500*q*q;f.vx+=(-f.x/d*a+(-f.y/d)*90*q)*dt;f.vy+=(-f.y/d*a+(f.x/d)*90*q)*dt;f.vx*=1-dt*.5;f.vy*=1-dt*.5;if(d<CAP){S.capCyc=c0;elim(f);continue}}
  else{f.vx+=(css()-.5)*160*dt;f.vy+=(css()-.5)*160*dt}
  f.x+=f.vx*dt;f.y+=f.vy*dt;
  let sp=Math.hypot(f.vx,f.vy);if(f!==S.tg||!S.open||S.capCyc===c0){if(sp<85){f.vx*=85/(sp||1);f.vy*=85/(sp||1)}else if(sp>260){f.vx*=.985;f.vy*=.985}}
  d=Math.hypot(f.x,f.y)||1;if(d+r>R){const nx=f.x/d,ny=f.y/d;f.x=nx*(R-r);f.y=ny*(R-r);const vn=f.vx*nx+f.vy*ny;if(vn>0){f.vx-=1.9*vn*nx;f.vy-=1.9*vn*ny}}
  for(let i=0;i<6&&!pt(f);i++){const s=seg(S.bars[i],S.ba),ex=s[2]-s[0],ey=s[3]-s[1];let t=((f.x-s[0])*ex+(f.y-s[1])*ey)/(ex*ex+ey*ey);t=Math.max(0,Math.min(1,t));const px=s[0]+ex*t,py=s[1]+ey*t,dx=f.x-px,dy=f.y-py,dd=Math.hypot(dx,dy)||1,m=r+7;
   if(dd<m){const nx=dx/dd,ny=dy/dd;f.x=px+nx*m;f.y=py+ny*m;const vn=f.vx*nx+f.vy*ny;if(vn<0){f.vx-=1.9*vn*nx;f.vy-=1.9*vn*ny}}}
 }
 for(let i=0;i<F.length;i++){const a=F[i];if(a.out||a.gone)continue;for(let j=i+1;j<F.length;j++){const b=F[j];if(b.out||b.gone||pt(a)||pt(b))continue;const dx=b.x-a.x,dy=b.y-a.y,m=a.r+b.r;if(dx*dx+dy*dy<m*m){const d=Math.hypot(dx,dy)||.01,nx=dx/d,ny=dy/d,o=(m-d)/2;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(vn<0){const j2=-1.92*vn/2;a.vx-=j2*nx;a.vy-=j2*ny;b.vx+=j2*nx;b.vy+=j2*ny}}}}
 for(let i=S.par.length-1;i>=0;i--){const p=S.par[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;if(p.l<=0)S.par.splice(i,1)}
 if(S.par.length>260)S.par.splice(0,S.par.length-260);
 for(let i=S.shock.length-1;i>=0;i--){S.shock[i]+=dt;if(S.shock[i]>.6)S.shock.splice(i,1)}
 if(S.winAt===2){S.winAt=0;win(F.find(f=>!f.out))}
}
// ---------- render ----------
function draw(){let g;
 X.setTransform(1,0,0,1,0,0);X.drawImage(BG,0,0);X.setTransform(DPR,0,0,DPR,0,0);
 X.save();X.translate(CX,CY);X.scale(K,K);
 // portal
 const o=S.open?Math.min(1,(S.ot||0)/.25):(S.wasOpen?0:0),t=performance.now()/1000;
 const op=S.open?Math.min(1,S.ot/.25,(OPEN-S.ot)/.2+.01):0;
 X.save();X.beginPath();X.arc(0,0,RING,0,7);X.fillStyle="#2a2c6a";X.fill();X.clip();
 for(let i=0;i<8;i++){X.fillStyle=i%2?"rgba(130,110,230,.5)":"rgba(90,80,190,.55)";X.beginPath();X.moveTo(0,0);X.arc(0,0,RING,i*.785+t*.2,(i+1)*.785+t*.2);X.fill()}
 if(op>0){g=X.createRadialGradient(0,0,0,0,0,RING);g.addColorStop(0,"rgba(0,0,0,"+op+")");g.addColorStop(.55,"rgba(0,0,0,"+op*.95+")");g.addColorStop(1,"rgba(120,60,220,"+op*.5+")");X.fillStyle=g;X.fillRect(-RING,-RING,RING*2,RING*2);
  X.lineWidth=3;for(let i=0;i<4;i++){X.strokeStyle=i%2?"rgba(56,189,248,"+op*.3+")":"rgba(192,132,252,"+op*.3+")";X.beginPath();for(let a=0;a<9;a+=.3){const rr=a*8;X.lineTo(Math.cos(a+t*9+i*1.57)*rr,Math.sin(a+t*9+i*1.57)*rr)}X.stroke()}}
 X.restore();
 X.globalAlpha=.25;X.lineWidth=14;X.strokeStyle=op>0?"#ff2d9a":"#f4b942";X.beginPath();X.arc(0,0,RING+op*6,0,7);X.stroke();X.globalAlpha=1;X.strokeStyle=op>0?"#ff2d9a":"#f4b942";X.lineWidth=5+op*2;X.beginPath();X.arc(0,0,RING+op*6,0,7);X.stroke();X.shadowBlur=0;
 for(const s of S.shock){X.strokeStyle="rgba(200,160,255,"+(1-s/.6)+")";X.lineWidth=6;X.beginPath();X.arc(0,0,RING+s*480,0,7);X.stroke()}
 // bars
 X.lineCap="round";X.lineWidth=14;X.strokeStyle="#7b6bd6";for(let i=0;i<6;i++){const s=seg(S.bars[i],S.ba);X.beginPath();X.moveTo(s[0],s[1]);X.lineTo(s[2],s[3]);X.stroke()}
 // flags
 for(const f of S.fl){if(f.gone)continue;let x=f.x,y=f.y,sc=1,rot=0;if(f.out){const k=Math.min(1,f.sk);const d=Math.hypot(x,y)*(1-k),a=Math.atan2(y,x)+f.ang*.3;x=Math.cos(a)*d;y=Math.sin(a)*d;sc=1-k;rot=f.ang}
  const rr=f.r*sc;if(rr<.5)continue;if(f.out){X.save();X.translate(x,y);X.rotate(rot);X.drawImage(spr(f.c),-rr,-rr,rr*2,rr*2);X.restore()}else X.drawImage(spr(f.c),x-rr,y-rr,rr*2,rr*2)}
 for(const p of S.par){X.globalAlpha=Math.max(0,p.l);X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,3,0,7);X.fill()}X.globalAlpha=1;
 X.restore();
 if(S.mode==="count"){}
}
// ---------- loop ----------
function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;
 if(S.mode==="play"){step(dt/2);step(dt/2)}
 else if(S.mode==="count"){S.cnt-=dt;const n=Math.ceil(S.cnt);const b=$("big");if(n!==S.lastC&&n>=1){S.lastC=n;b.textContent=n;b.classList.remove("s");void b.offsetWidth;b.classList.add("s");sfx.beep(0)}
  if(S.cnt<=0){S.mode="play";b.textContent="GO!";b.classList.remove("s");void b.offsetWidth;b.classList.add("s");sfx.beep(1)}}
 draw();requestAnimationFrame(loop)}
// ---------- UI ----------
function pause(){if(S.mode==="play"){S.mode="pause";$("bp").textContent="▶"}else if(S.mode==="pause"){S.mode="play";$("bp").textContent="⏸"}}
$("go").onclick=start;$("pa").onclick=start;$("ch").onclick=()=>{clearInterval(AI);$("wn").classList.add("h");$("st").classList.remove("h")};
$("bp").onclick=pause;
$("bs").onclick=()=>{mute=!mute;$("bs").textContent=mute?"🔇":"🔊";if(mute)clearV()};
$("bv").onclick=()=>{voiceOn=!voiceOn;$("bv").style.opacity=voiceOn?1:.4;if(!voiceOn)clearV()};
$("br2").onclick=start;
document.addEventListener("visibilitychange",()=>{if(document.hidden&&S.mode==="play")pause()});
addEventListener("resize",resize);addEventListener("orientationchange",()=>setTimeout(resize,200));
document.addEventListener("touchmove",e=>{if(!e.target.closest("input,#lst"))e.preventDefault()},{passive:false});
const q=parseInt(new URLSearchParams(location.search).get("n"));$("ni").value=q>0?Math.min(q,ALL.length):64;
// the controls are only reachable once a battle is running
["bp","bs","bv","br2"].forEach(i=>$(i).style.zIndex=3);
const lst=$("lst");lst.innerHTML=ALL.map(c=>'<i data-id="'+c.id+'">'+c.e+" "+c.n+"</i>").join("");
const upd=()=>{$("sc").textContent=SEL.size+" selected"};
lst.onclick=e=>{const i=e.target.closest("i");if(!i)return;const id=+i.dataset.id;SEL.has(id)?SEL.delete(id):SEL.add(id);i.classList.toggle("on");upd()};
$("sa").onclick=()=>{ALL.forEach(c=>SEL.add(c.id));[...lst.children].forEach(i=>i.classList.add("on"));upd()};
$("sn").onclick=()=>{SEL.clear();[...lst.children].forEach(i=>i.classList.remove("on"));upd()};
$("sq").oninput=e=>{const q=e.target.value.toLowerCase();[...lst.children].forEach((i,k)=>i.style.display=ALL[k].n.toLowerCase().includes(q)?"":"none")};
const tv=()=>{ac();clearV();say("Spain is out!",1)};
$("vc").onchange=e=>{VC=e.target.value;tv()};$("vn").onchange=e=>{VN=e.target.value;tv()};$("vt").onclick=tv;
$("mR").onclick=()=>{MODE="r";$("mR").classList.add("on");$("mS").classList.remove("on");$("pR").style.display="";$("pS").style.display="none"};
$("mS").onclick=()=>{MODE="s";$("mS").classList.add("on");$("mR").classList.remove("on");$("pS").style.display="block";$("pR").style.display="none";upd()};
resize();build(pick());requestAnimationFrame(loop);
</script></body></html>
